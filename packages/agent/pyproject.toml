[project]
name = "muse-agent"
version = "0.1.0"
description = "Muse home agent: library publishing, daily playlists and backups"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.scripts]
muse-agent = "muse_agent.main:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "muse_agent"
module-root = ""
