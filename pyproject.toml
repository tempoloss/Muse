[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "ty==0.0.84",
    "import-linter>=2.15",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["muse", "muse_agent"]
